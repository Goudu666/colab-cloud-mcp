[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-cloud-mcp"
version = "0.1.0"
description = "Cloud-to-Colab Remote MCP server over Streamable HTTP for Claude and Google Antigravity"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["mcp", "colab", "google-colab", "streamable-http", "claude", "antigravity", "gpu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "starlette>=0.25.0",
    "uvicorn>=0.17.0",
]

[project.optional-dependencies]
ngrok = ["pyngrok>=7.0.0"]
dev = ["httpx>=0.23.0", "pytest>=7.0.0"]

[project.urls]
Homepage = "https://github.com/Goudu666/colab-cloud-mcp"
Repository = "https://github.com/Goudu666/colab-cloud-mcp"
Issues = "https://github.com/Goudu666/colab-cloud-mcp/issues"

[project.scripts]
colab-cloud-mcp = "colab_cloud_mcp.tunnel:cli_main"

[tool.setuptools.packages.find]
include = ["colab_cloud_mcp*"]
